name: Build TimerRoot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Exploit Binary Repository
        run: |
          git clone https://github.com/YuKongA/CVE-2026-98260
          mkdir -p app/src/main/assets
          cp CVE-2026-98260/timer/timer app/src/main/assets/timer || true
          chmod +x app/src/main/assets/timer

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimerRoot-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
